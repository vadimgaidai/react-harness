name: checks

on:
  push:
    branches: [main]
  pull_request:

# Read-only: the workflow runs checks and never writes back, so a fork-triggered
# run can't receive a write-scoped token even under a permissive account default.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Claude Code's own validator, the same two commands CONTRIBUTING.md gives for a local run.
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
      - run: for p in plugins/*/; do claude plugin validate --strict "$p" || exit 1; done
